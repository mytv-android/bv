name: Legacy Migration Bridge Build

# 手动构建迁移用 APK：
# - legacy：旧 applicationId 的桥接版，发布到 bv 的 release，覆盖安装不丢数据；
# - mybv：新包名 myBV，用于首个 myBV release 或迁移验证。
# 若 myBV 使用与桥接版不同的签名，先把 myBV 证书 SHA-256 写入仓库变量
# MYBV_CERT_SHA256，桥接版才会信任它。



on:
  workflow_dispatch:
    inputs:
      build_target:
        description: "legacy = 旧包名桥接版；mybv = 新包名 myBV"
        required: true
        default: legacy
        type: choice
        options:
          - legacy
          - mybv

jobs:
  build-bridge:
    name: Build migration apk
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
          submodules: 'true'

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Write google-services.json
        env:
          DATA: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: echo $DATA > app/google-services.json

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Add signing properties
        env:
          SIGNING_PROPERTIES: ${{ secrets.SIGNING_PROPERTIES }}
        run: |
          echo ${{ secrets.SIGNING_PROPERTIES }} > encoded_signing_properties
          base64 -Dd -i encoded_signing_properties > signing.properties

      - name: Add jks file
        run: |
          echo ${{ secrets.SIGN_KEY }} > ./encoded_key
          base64 -Dd -i encoded_key > key.jks

      - name: Build apk
        env:
          BV_LEGACY_APP_ID: ${{ inputs.build_target == 'legacy' && 'true' || 'false' }}
          BV_VERSION_CODE_OFFSET: ${{ inputs.build_target == 'mybv' && '1' || '0' }}
          MYBV_CERT_SHA256: ${{ vars.MYBV_CERT_SHA256 }}
        run: ./gradlew assembleDefaultAlpha

      - name: Read alpha apk output metadata
        id: apk-meta-alpha
        uses: juliangruber/read-file-action@v1
        with:
          path: app/build/outputs/apk/default/alpha/output-metadata.json

      - name: Parse apk infos
        id: apk-infos
        run: |
          echo "alpha_info_version_code=${{ fromJson(steps.apk-meta-alpha.outputs.content).elements[0].versionCode }}" >> $GITHUB_ENV
          echo "alpha_info_version_name=${{ fromJson(steps.apk-meta-alpha.outputs.content).elements[0].versionName }}" >> $GITHUB_ENV

      - name: Upload apk
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.build_target == 'mybv' && 'myBV app' || 'Legacy BV migration bridge' }}
          path: app/build/outputs/apk/default/alpha/BV_${{ env.alpha_info_version_code }}_${{ env.alpha_info_version_name }}_default_universal.apk
